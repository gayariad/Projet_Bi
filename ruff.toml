# Config ruff pour la CI.
# Pour l'instant on ne bloque que sur les vraies erreurs (syntaxe, imports inutilisés,
# variables non définies...). On durcira quand le code existant sera nettoyé.
target-version = "py311"
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]

[format]
quote-style = "double"
